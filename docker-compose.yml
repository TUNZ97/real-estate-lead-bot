# Local development services for PrimeHomes Lead Bot
# Usage: docker compose up -d
# Do not use this compose file as a production deployment.

services:
  postgres:
    image: postgres:16-alpine
    container_name: primehomes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: primehomes
      POSTGRES_PASSWORD: primehomes
      POSTGRES_DB: primehomes_lead_bot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U primehomes -d primehomes_lead_bot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
